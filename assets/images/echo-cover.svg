  <ellipse cx="420" cy="430" rx="34" ry="15" fill="#665c37" stroke="#f0cf79" stroke-width="2"/>
  <g transform="translate(420 405)" fill="none" stroke="#8ccfc2" stroke-width="4"><rect x="-20" y="-5" width="40" height="43" rx="16"/><circle cy="-23" r="19"/></g>
  <path d="M532 341V271Q532 238 565 238H575Q608 238 608 271V341" fill="none" stroke="#8ccfc2" stroke-width="6"/>
  <rect x="532" y="341" width="76" height="7" rx="3" fill="#385b58"/>
  <circle cx="680" cy="285" r="140" fill="url(#light)"/>
  <g transform="translate(680 285)" fill="#f0cf79"><rect x="-22" y="-5" width="44" height="44" rx="17"/><circle cy="-25" r="22"/></g>
  <g fill="#101d21"><circle cx="673" cy="259" r="3"/><circle cx="687" cy="259" r="3"/></g>
  <path d="M780 150Q785 177 810 180Q785 185 780 210Q775 185 750 180Q775 175 780 150" fill="#f0cf79"/>
 </g>
 <g opacity=".7"><use href="#leaf" x="148" y="660"/><use href="#leaf" x="940" y="151"/><use href="#leaf" x="486" y="755"/><use href="#leaf" x="1045" y="677"/></g>
</svg>
