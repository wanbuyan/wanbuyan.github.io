  <radialGradient id="light"><stop stop-color="#f0cf79" stop-opacity=".25"/><stop offset="1" stop-color="#f0cf79" stop-opacity="0"/></radialGradient>
  <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse"><rect x="7" y="15" width="106" height="99" rx="14" fill="#182b30"/><rect x="7" y="7" width="106" height="99" rx="14" fill="#293e40" stroke="#35574c" stroke-opacity=".3"/></pattern>
  <g id="leaf" fill="none" stroke="#517363" stroke-width="5" stroke-linecap="round"><path d="M0 28V-19M0 11Q-31 3-27-17Q-2-15 0 11M0 0Q25-3 26-27Q2-28 0 0"/></g>
 </defs>
 <rect width="1200" height="900" fill="url(#night)"/>
