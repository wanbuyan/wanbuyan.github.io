  <path d="M0 0H480V120H840V600H360V480H0Z" fill="url(#tiles)"/>
  <path d="M60 60H300V420H420" fill="none" stroke="#8ccfc2" stroke-width="5" stroke-dasharray="8 16" stroke-linecap="round" opacity=".65"/>
