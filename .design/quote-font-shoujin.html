<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瘦金方向</title><style>
    :root { color-scheme: light; --paper:#f8f7f3; --ink:#292a26; --muted:#717368; --rule:#dedfd6; --accent:#a93627; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei",sans-serif; }
    main { max-width:1200px; margin:auto; padding:42px 64px 28px; }
    header { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:28px; }
    h1 { font-size:25px; font-weight:600; margin:0; letter-spacing:.04em; }
    header p { color:var(--muted); font-size:13px; margin:0; }
    section { border-top:1px solid var(--rule); padding:22px 0 30px; }
    .label { display:flex; align-items:center; gap:12px; }
    .letter { color:var(--accent); font-size:13px; font-weight:600; }
    h2 { font-size:15px; font-weight:500; margin:0; }
    .note { color:var(--muted); margin-left:auto; font-size:12px; }
    .recommended { color:var(--accent); }
    figure { margin:29px 0 0; text-align:center; }
    blockquote { margin:0; }
    .quote { margin:0; font-size:32px; font-weight:400; line-height:1.85; letter-spacing:.025em; font-synthesis:none; }
    .serif .quote { font-family:"Noto Serif SC",serif; }
    .kai .quote { font-family:"KaiTi",serif; }
    .fang .quote { font-family:"STFangsong",serif; }
    .xing .quote { font-family:"STXingkai",serif; }
    figcaption { margin-top:19px; color:var(--muted); font-size:13px; letter-spacing:.12em; line-height:1.8; }
    figcaption span { margin-right:12px; }
    footer { border-top:1px solid var(--rule); padding-top:18px; color:var(--muted); font-size:12px; }
    @media(max-width:700px) {
      main { padding:28px 24px; }
      header { display:block; } header p { margin-top:12px; }
      section { padding-bottom:28px; }
      .label { flex-wrap:wrap; gap:8px; }
      .note { margin-left:auto; }
      .quote { font-size:25px; line-height:1.9; }
      figure { margin-top:24px; }
    }
  
@font-face {font-family:WenKaiPreview;src:url('qa/font-options/LXGWWenKai-Regular.ttf') format('truetype');font-weight:400;font-display:block;}
@font-face {font-family:MaShanPreview;src:url('qa/font-options/mashanzheng.woff2') format('truetype');font-weight:400;font-display:block;}
@font-face {font-family:SanjiShouJinPreview;src:url('qa/font-options/sanjishoujin.ttf') format('truetype');font-weight:400;font-display:block;}
@font-face {font-family:FZShouJinPreview;src:url('qa/font-options/fangzhengshoujin.woff') format('woff');font-weight:400;font-display:block;}
.kai1 .quote{font-family:KaiTi,serif;}.kai2 .quote{font-family:STKaiti,serif;}
.kai3 .quote{font-family:WenKaiPreview,serif;}.kai4 .quote{font-family:MaShanPreview,serif;}
.shoujin5 .quote{font-family:SanjiShouJinPreview,serif;}.shoujin6 .quote{font-family:FZShouJinPreview,serif;}
</style></head><body><main><header><h1>瘦金方向</h1><p>同字号对比 · 第 6 款为官网字样</p></header><section class="shoujin5"><div class="label"><span class="letter">5</span><h2>三极瘦金体简</h2><span class="note">细长、锋利</span></div><figure><blockquote><p class="quote">昨夜西风凋碧树，独上高楼，望尽天涯路。</p></blockquote><figcaption><span>摘自 ·</span>晏殊《蝶恋花》</figcaption></figure></section><section class="shoujin6"><div class="label"><span class="letter">6</span><h2>方正瘦金书</h2><span class="note">筋骨分明 · 官网字样</span></div><figure><blockquote><p class="quote">三更灯火五更鸡，正是男儿读书时。</p></blockquote><figcaption>方正字库官网示例文字</figcaption></figure></section><footer>真实字库预览</footer></main></body></html>
