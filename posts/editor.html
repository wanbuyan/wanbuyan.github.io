<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../"><title>写帖工具 | 万不言的博客</title><link rel="stylesheet" href="assets/style.css"><script src="posts/posts.js" defer></script><script src="assets/posts-core.js" defer></script><script src="posts/editor.js" defer></script></head>
<body>
  <header class="site-header container"><a class="brand" href="index.html#posts">万不言的博客</a><a class="text-link" href="index.html#posts">返回帖子</a></header>
  <main class="container editor-main"><section class="page-intro"><h1>写帖工具</h1><p>填写内容，导出 posts.js，再替换网站的同名文件并上传 GitHub。</p></section>
    <label class="editor-select">编辑已有帖子<select id="editor-existing"><option value="">新建帖子</option></select></label>
    <div class="editor-layout"><form id="post-form" class="editor-form">
      <label>标题<input id="editor-title" required maxlength="120"></label>
      <div class="editor-field-row"><label>文章标识<input id="editor-id" required pattern="[a-zA-Z0-9_-]+" placeholder="如 my-first-post"></label><label>日期<input id="editor-date" type="date" required></label></div>
      <label>分类<input id="editor-category" value="随笔" maxlength="40"></label>
      <label>摘要<textarea id="editor-excerpt" rows="2" maxlength="240"></textarea></label>
      <label>正文（Markdown）<textarea id="editor-content" rows="18" required placeholder="## 小标题&#10;&#10;正文&#10;&#10;![图片说明](posts/images/文件名.jpg)"></textarea></label>
      <label class="editor-draft"><input id="editor-draft" type="checkbox"> 保存为草稿（网站不显示）</label>
      <div class="editor-footer"><button class="button primary" type="submit">保存并导出 posts.js</button><button class="button secondary" id="editor-new" type="button">新建下一篇</button></div>
      <p id="editor-message" role="status" aria-live="polite"></p>
      <p class="editor-help">导出包含原有帖子和本次修改。下载文件本身不会发布；配图需另外放入 posts/images 文件夹。草稿仅在当前浏览器暂存。</p>
    </form><section class="editor-preview post-reader" aria-label="帖子预览"><p class="post-meta">预览</p><h1 id="preview-title">帖子标题</h1><div id="preview-content" class="post-content"></div></section></div>
  </main>
</body></html>
